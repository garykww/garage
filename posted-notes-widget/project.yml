name: PostedNotes
options:
  bundleIdPrefix: dev.garage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# App-group data sharing requires a team-prefixed group ID and a real
# development certificate. Change TEAM_ID (and the group IDs below +
# NotesStore.appGroupID) to your own team to build on another machine;
# CI builds with CODE_SIGNING_ALLOWED=NO so it never needs the cert.
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6PU94W2HBX

targets:
  PostedNotes:
    type: application
    platform: macOS
    sources:
      - PostedNotes
      - Shared
    entitlements:
      path: PostedNotes/PostedNotes.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - 6PU94W2HBX.dev.garage.posted-notes
    info:
      path: PostedNotes/Info.plist
      properties:
        CFBundleDisplayName: Posted Notes
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.garage.posted-notes
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: PostedNotesWidget
        embed: true

  PostedNotesWidget:
    type: extensionkit-extension
    platform: macOS
    sources:
      - PostedNotesWidget
      - Shared
    entitlements:
      path: PostedNotesWidget/PostedNotesWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 6PU94W2HBX.dev.garage.posted-notes
    info:
      path: PostedNotesWidget/Info.plist
      properties:
        CFBundleDisplayName: Posted Notes
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.garage.posted-notes.widget
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
